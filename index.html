<!DOCTYPE html>
<html>

<head>

<title>Tranzit Driver Onboarding</title>

<link rel="icon" type="image/x-icon" href="favicon.ico">

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

</head>

<body>

<div class="container">

<h1 class="title">Tranzit Driver Onboarding</h1>

<div class="progressBar">
<div id="progressFill"></div>
</div>


<!-- STEP 1 -->

<div id="step1">

<input type="text" id="firstName" placeholder="First Name" maxlength="20">
<small class="error" id="firstNameError"></small>

<input type="text" id="lastName" placeholder="Last Name" maxlength="20">
<small class="error" id="lastNameError"></small>

<select id="gender">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>
<small class="error" id="genderError"></small>

<select id="city">

<option value="">City in Lagos</option>

<option>Ikeja</option>
<option>Lekki</option>
<option>Ikoyi</option>
<option>Yaba</option>
<option>Surulere</option>
<option>Ajah</option>
<option>Agege</option>
<option>Magodo</option>
<option>Mushin</option>
<option>Maryland</option>
<option>Victoria Island</option>
<option>Festac</option>
<option>Apapa</option>

</select>
<small class="error" id="cityError"></small>

<input type="tel" id="phone" placeholder="Phone Number">
<small class="error" id="phoneError"></small>

<input type="email" id="email" placeholder="Email Address">
<small class="error" id="emailError"></small>

<input type="text" id="license" placeholder="Driver License Number (max 12)" maxlength="12">
<small class="error" id="licenseError"></small>

<input type="text" id="ninbvn" placeholder="Enter your 11-digit NIN" inputmode="numeric" maxlength="11">
<small class="error" id="ninError"></small>

<button onclick="goToStep2()">Continue</button>

</div>


<!-- STEP 2 -->

<div id="step2" class="hidden">

<label class="uploadCard">

<input type="file" id="selfie" accept="image/*" capture="user">

<div class="uploadContent">
<div class="uploadIcon">
<i class="fa-solid fa-camera"></i>
</div>
<p>Take Selfie</p>
<small>.jpeg or .png<br>max 5mb</small>
</div>

</label>

<img id="selfiePreview" class="preview">

<label class="uploadCard">

<input type="file" id="licensePhoto" accept="image/*" capture="environment">

<div class="uploadContent">
<div class="uploadIcon">
<i class="fa-solid fa-id-card"></i>
</div>
<p>Upload driver's License</p>
<small>.jpeg or .png<br>max 5mb</small>
</div>

</label>

<img id="licensePreview" class="preview">

<button onclick="startConfirmation()">Continue to Confirm</button>

</div>


<!-- STEP 3 (REVIEW) -->

<div id="step3" class="hidden">

<h2>Review Your Information</h2>

<div class="reviewBox">

<p><strong>First Name:</strong> <span id="r_firstName"></span></p>
<p><strong>Last Name:</strong> <span id="r_lastName"></span></p>
<p><strong>Email:</strong> <span id="r_email"></span></p>
<p><strong>Phone:</strong> <span id="r_phone"></span></p>
<p><strong>Gender:</strong> <span id="r_gender"></span></p>
<p><strong>City:</strong> <span id="r_city"></span></p>
<p><strong>License:</strong> <span id="r_license"></span></p>
<p><strong>NIN:</strong> <span id="r_nin"></span></p>

<div class="reviewImages">
<img id="r_selfie" class="preview">
<img id="r_licensePhoto" class="preview">
</div>

</div>

<div class="reviewActions">
<button onclick="goToStep1()">Edit</button>
<button onclick="finalSubmit()">Submit</button>
</div>

</div>

<!-- SUCCESS POPUP -->
<div id="successPopup" class="success-popup hidden">
  <div class="success-box">
    <h2>Registration Submitted</h2>
    <p>Your information has been received and is currently under review.</p>
    <p>You should expect a response soon.</p>
    <p>Welcome to Tranzit!</p>
    <button onclick="joinWhatsapp()" class="whatsapp-btn">

<span class="whatsapp-icon-wrapper">
<img src="whatsapp1.jpg" class="whatsapp-icon default-icon">
<img src="whatsapp2.jpg" class="whatsapp-icon hover-icon">
</span>

Join WhatsApp Group

</button>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
